<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}ChronoCare{% endblock %}</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />

    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>

    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <header class="navbar">
      <div class="nav-inner">
        <!-- Logo -->
        <a href="{{ url_for('index') }}" class="brand">
          <img src="{{ url_for('static', filename='images/image.png') }}" alt="ChronoCare logo" class="brand-logo" />
          <span class="brand-name">Chrono<span class="brand-accent">Care</span></span>
        </a>

        <!-- Main links -->
        <nav class="nav-links">
          <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
            <i data-lucide="house"></i> Overview
          </a>
          <a href="#" class="nav-link"><i data-lucide="utensils"></i> Meal plan</a>
          <a href="#" class="nav-link"><i data-lucide="activity"></i> Exercise</a>
          <a href="#" class="nav-link"><i data-lucide="moon"></i> Sleep</a>
          <a href="#" class="nav-link"><i data-lucide="chart-column"></i> Insights</a>
        </nav>

        <!-- Right side -->
        <div class="nav-right">
          <button class="icon-btn" aria-label="Notifications">
            <i data-lucide="bell"></i>
            <span class="dot"></span>
          </button>
          <a href="#" class="profile">
            <span class="avatar">MS</span>
            <span class="profile-text">
              <strong>Maya Singh</strong>
              <small>My profile</small>
            </span>
            <i data-lucide="chevron-down" class="chevron"></i>
          </a>
        </div>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script>lucide.createIcons();</script>

    {% block scripts %}{% endblock %}
  </body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}ChronoCare{% endblock %}</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />

    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>

    {% block head_extra %}{% endblock %}
</head>

<body>
    <header class="navbar">
        <div class="nav-inner">
            <!-- Logo -->
            <a href="{{ url_for('index') }}" class="brand">
                <img src="{{ url_for('static', filename='images/image.png') }}" alt="ChronoCare logo"
                    class="brand-logo" />
                <span class="brand-name">Chrono<span class="brand-accent">Care</span></span>
            </a>

            <!-- Main links -->
            <nav class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                    <i data-lucide="house"></i> Overview
                </a>
                <a href="{{ url_for('diet_plan') }}" class="nav-link"><i data-lucide="utensils"></i> Diet Plan </a>
                <a href="{{ url_for('exercise') }}" class="nav-link"><i data-lucide="activity"></i> Exercise </a>
                <a href="{{ url_for('sleep') }}" class="nav-link"><i data-lucide="moon"></i> Sleep </a>
                <a href="{{ url_for('insights') }}" class="nav-link"><i data-lucide="chart-column"></i> Insights </a>
            </nav>

            <!-- Right side -->
            <div class="nav-right">
                <button class="icon-btn" aria-label="Notifications">
                    <i data-lucide="bell"></i>
                    <span class="dot"></span>
                </button>
                <div class="profile-menu">
                    <button class="profile" id="profileBtn" aria-haspopup="true" aria-expanded="false">
                        <span class="avatar">UP{# Once profile is set up: {{ current_user.first_name[0] }}{{
                            current_user.last_name[0] }} #}</span>
                        <span class="profile-text">
                            <strong>User Profile{# Once profile is set up: {{ current_user.first_name }} {{
                                current_user.last_name }} #}</strong>
                            <small>My profile</small>
                        </span>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </button>

                    <div class="dropdown" id="profileDropdown">
                        <a href="{{ url_for('profile') }}" class="dropdown-item">
                            <i data-lucide="user"></i> My profile
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item danger"> {# change to url_for('logout') once it exists #}
                            <i data-lucide="log-out"></i> Log out
                        </a>
                    </div>
                </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

    <!-- Site JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>

</html>
